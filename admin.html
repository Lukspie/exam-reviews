<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="grain"></div>

  <!-- Login screen -->
  <div id="login-screen" class="center">
    <div class="card" style="max-width: 360px;">
      <div class="card-header">
        <span class="tag">admin</span>
      </div>
      <h1 class="title" style="font-size: 1.6rem; margin-bottom: 1.5rem;">Prístup</h1>
      <div class="input-group">
        <input type="password" id="admin-pass" placeholder="Heslo" onkeydown="if(event.key==='Enter') tryLogin()">
      </div>
      <button onclick="tryLogin()" id="submit-btn">
        <span>Vstúpiť</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>
      </button>
      <p id="login-error" class="hidden" style="color:#ef4444; font-family:'DM Mono',monospace; font-size:0.75rem; margin-top:0.75rem; text-align:center;">Nesprávne heslo.</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">
    <header class="admin-header">
      <div class="admin-header-left">
        <span class="tag">admin</span>
        <h1 class="admin-title">Dashboard</h1>
      </div>
      <a href="index.html" class="back-link">← späť na stránku</a>
    </header>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">—</div>
        <div class="stat-label">celkom správ</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-today">—</div>
        <div class="stat-label">dnes</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-approved">—</div>
        <div class="stat-label">schválených</div>
      </div>
    </div>

    <div class="admin-table-wrap">
      <div class="table-header-row">
        <span class="tag">správy</span>
        <button class="refresh-btn" onclick="loadReviews()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          refresh
        </button>
      </div>
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Meno</th>
            <th>Správa</th>
            <th>Dátum</th>
            <th>Status</th>
            <th>Akcia</th>
          </tr>
        </thead>
        <tbody id="reviews-tbody">
          <tr><td colspan="6" style="text-align:center; color: var(--muted); padding: 2rem;">Načítavam...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
